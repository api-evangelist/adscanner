aid: adscanner
name: Adscanner
description: 'AdScanner — now trading as all eyes on screens (AEOS), the legal entity
  all eyes on screens d.o.o. of Zagreb, Croatia, formerly Adscanner d.o.o. — is a
  European TV and video advertising measurement, planning and activation platform
  founded in 2012. In-house AI video-recognition software matches broadcast ad
  creatives second-by-second against viewing data supplied by IPTV and telco
  partners, producing cross-channel reach, frequency and attribution measurement
  for linear, addressable and connected TV. Products include the AdScanner/AEOS
  Cockpit analytics dashboard, the Apollo AI-based ex-ante planning module, TV
  Boost data activation on post-code segments, and TV Match cross-device targeting
  and TV-sync signals that fire digital campaigns when a spot airs. AEOS operates
  in Croatia, Austria, Germany, Bulgaria and Switzerland. The company states in its
  own FAQ that its data can be obtained via reporting (PDF, Excel, CSV, JSON) and
  API on request, but publishes no public developer portal, API reference or
  machine-readable contract.'
